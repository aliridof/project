# _config.yml
title: "Aliridof - Project"
description: "Project"
baseurl: "/project"  # Sesuaikan dengan nama repo
url: "https://aliridof.github.io"  # Ganti dengan username GitHub Anda

# Theme settings
theme: jekyll-theme-cayman  # atau theme lain

# Build settings
markdown: kramdown
permalink: pretty

# Custom settings
repository: "aliridof/project"  # Ganti dengan repo Anda
github_username: "aliridof"  # Ganti dengan username Anda

# Collections untuk pages
collections:
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "assets"
      type: "pages" 
    values:
      layout: "null"

# Exclude dari processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
