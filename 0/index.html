<!DOCTYPE html>
<html>
<head>
    <title>Auto Index</title>
</head>
<body>
    <h1>Daftar File dalam Repository</h1>
    <div id="file-list"></div>

    <script>
        // Daftar file yang ingin di-index
        const files = [
            { name: "Halaman Utama", path: "index.html" },
            { name: "Dokumentasi", path: "docs.html" },
            { name: "Tentang", path: "about.html" },
            { name: "Project 1", path: "projects/project1.html" }
        ];

        const fileList = document.getElementById('file-list');
        const ul = document.createElement('ul');

        files.forEach(file => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = file.path;
            a.textContent = file.name;
            li.appendChild(a);
            ul.appendChild(li);
        });

        fileList.appendChild(ul);
    </script>
</body>
</html>
